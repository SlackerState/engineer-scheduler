# 自动打包：每次推送到 main 都在 Windows / Mac 上各打一个包（Actions 页面下载）；
# 推送 v 开头的标签（如 v1.0.0）时，额外把两个包发布到 Releases。
name: 打包

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: EngineerScheduler-windows
            sep: ";"
          - os: macos-latest
            artifact: EngineerScheduler-macos-arm64
            sep: ":"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      APP_NAME: 工程师排班管理
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: PyInstaller 打包
        shell: bash
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name "$APP_NAME"
          --add-data "ui${{ matrix.sep }}ui"
          --collect-all playwright --collect-all webview
          main.py

      - name: 冒烟测试（网页模式启动打包后的程序）
        shell: bash
        timeout-minutes: 5
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="dist/$APP_NAME/$APP_NAME.exe"
          else
            BIN="dist/$APP_NAME.app/Contents/MacOS/$APP_NAME"
          fi
          export ES_DATA_DIR="$RUNNER_TEMP/es-data"
          # 输出重定向到文件，避免后台进程占住步骤的输出管道
          "$BIN" --web --port 8765 > smoke.log 2>&1 &
          PID=$!
          stop() {
            if [ "$RUNNER_OS" = "Windows" ]; then
              taskkill //F //T //IM "$APP_NAME.exe" > /dev/null 2>&1 || true
            else
              kill "$PID" 2>/dev/null || true
            fi
          }
          trap stop EXIT
          ok=""
          for i in $(seq 1 45); do
            if curl -sf -X POST http://127.0.0.1:8765/api/bootstrap -d '[]' > boot.json; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "程序没有启动"; cat smoke.log || true; exit 1; fi
          grep -q '"ok": true' boot.json
          curl -sf http://127.0.0.1:8765/ | grep -q 'es-mode'
          echo "打包后的程序启动正常"

      - name: 压缩（Mac）
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/$APP_NAME.app" "${{ matrix.artifact }}.zip"

      - name: 压缩（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:APP_NAME" -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
