# 自动打包：每次推送到 main 都在 Windows / Mac 上各打一个包（Actions 页面下载）；
# 推送 v 开头的标签（如 v1.0.0）时，额外把两个包发布到 Releases。
name: 打包

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: EngineerScheduler-windows
            sep: ";"
          - os: macos-latest
            artifact: EngineerScheduler-macos-arm64
            sep: ":"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      APP_NAME: 工程师排班管理
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 写入版本号（仅标签发版）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          printf '# 发版时由 GitHub Actions 按标签改写\n__version__ = "%s"\n' "${GITHUB_REF_NAME#v}" > backend/version.py
          cat backend/version.py

      - name: PyInstaller 打包
        shell: bash
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name "$APP_NAME"
          --add-data "ui${{ matrix.sep }}ui"
          --collect-all playwright --collect-all webview
          main.py

      - name: 冒烟测试（Mac：网页模式启动打包后的程序）
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 5
        run: |
          export ES_DATA_DIR="$RUNNER_TEMP/es-data"
          "dist/$APP_NAME.app/Contents/MacOS/$APP_NAME" --web --port 8765 > smoke.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          ok=""
          for i in $(seq 1 45); do
            if curl -sf --max-time 5 -X POST http://127.0.0.1:8765/api/bootstrap -d '[]' > boot.json; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "程序没有启动"; cat smoke.log || true; exit 1; fi
          grep -q '"ok": true' boot.json
          curl -sf --max-time 5 http://127.0.0.1:8765/ | grep -q 'es-mode'
          echo "打包后的程序启动正常"

      - name: 冒烟测试（Windows：网页模式启动打包后的程序）
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:ES_DATA_DIR = Join-Path $env:RUNNER_TEMP "es-data"
          $exe = Join-Path (Get-Location) "dist\$env:APP_NAME\$env:APP_NAME.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--web", "--port", "8765" -PassThru `
               -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            if ($p.HasExited) { break }
            try {
              $r = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8765/api/bootstrap" -Body "[]" -TimeoutSec 5
              if ($r.ok) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) {
            Write-Host "程序没有启动"; if ($p.HasExited) { Write-Host "退出码：$($p.ExitCode)" }
            Get-Content smoke.out, smoke.err -ErrorAction SilentlyContinue
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          $html = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -TimeoutSec 5 -UseBasicParsing
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($html.Content -notmatch "es-mode") { Write-Host "页面内容不对"; exit 1 }
          Write-Host "打包后的程序启动正常"

      - name: 自检（Windows：各组件能否加载）
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = Join-Path (Get-Location) "dist\$env:APP_NAME\$env:APP_NAME.exe"
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          Start-Process -FilePath $exe -ArgumentList "--selftest", $out -Wait
          Get-Content $out -Encoding utf8
          $r = Get-Content $out -Encoding utf8 | ConvertFrom-Json
          if ($r.error -or -not $r.ui -or -not $r.edge) { Write-Host "自检失败"; exit 1 }

      - name: 冒烟测试（Windows：桌面窗口模式，Edge 应用窗口）
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:ES_DATA_DIR = Join-Path $env:RUNNER_TEMP "es-data-desktop"
          $env:ES_PORT = "8766"
          $exe = Join-Path (Get-Location) "dist\$env:APP_NAME\$env:APP_NAME.exe"
          $p = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            if ($p.HasExited) { break }
            try {
              $r = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8766/api/bootstrap" -Body "[]" -TimeoutSec 5
              if ($r.ok) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 2 }
          }
          Start-Sleep -Seconds 3
          $edge = Get-CimInstance Win32_Process -Filter "Name = 'msedge.exe'" | Where-Object { $_.CommandLine -like "*es-ui-*" }
          Write-Host "Edge 应用窗口进程数：$(@($edge).Count)"
          $edge | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Host "桌面模式没有启动"; if ($p.HasExited) { Write-Host "退出码：$($p.ExitCode)" }; exit 1 }
          if (@($edge).Count -eq 0) { Write-Host "没有打开 Edge 窗口"; exit 1 }
          Write-Host "桌面模式启动正常"

      - name: 冒烟测试（Windows：Edge 启动进程先退出，窗口仍要能用）
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          # 模拟 Edge 把窗口交给另一个进程后自己先退出：启动器拉起真正的 Edge 就结束
          $edgeExe = @("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          $launcher = Join-Path $env:RUNNER_TEMP "fake-edge.cmd"
          Set-Content -Path $launcher -Encoding ascii -Value "@start `"`" `"$edgeExe`" %*"
          $env:ES_DATA_DIR = Join-Path $env:RUNNER_TEMP "es-data-handoff"
          $env:ES_PORT = "8767"
          $env:ES_EDGE = $launcher
          $exe = Join-Path (Get-Location) "dist\$env:APP_NAME\$env:APP_NAME.exe"
          $p = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            if ($p.HasExited) { break }
            try { $r = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8767/api/bootstrap" -Body "[]" -TimeoutSec 5; if ($r.ok) { $ok = $true; break } } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) { Write-Host "没有启动"; Get-Content (Join-Path $env:ES_DATA_DIR "ui.log") -ErrorAction SilentlyContinue; exit 1 }
          Start-Sleep -Seconds 35  # 超过 20 秒无心跳就会退出：还活着说明页面心跳在维持服务
          $alive = -not $p.HasExited
          try { $r = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8767/api/bootstrap" -Body "[]" -TimeoutSec 5; $served = [bool]$r.ok } catch { $served = $false }
          Write-Host "---- ui.log ----"; Get-Content (Join-Path $env:ES_DATA_DIR "ui.log")
          Write-Host "启动进程退出 35 秒后：程序在运行 $alive，页面服务正常 $served"
          $edge = Get-CimInstance Win32_Process -Filter "Name = 'msedge.exe'" | Where-Object { $_.CommandLine -like "*es-ui-*" }
          $edge | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          $exited = $p.WaitForExit(40000)
          Write-Host "关掉 Edge 窗口后程序自行退出：$exited"
          if (-not $exited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not ($alive -and $served -and $exited)) { exit 1 }
          Write-Host "Edge 交接场景正常"

      - name: 压缩（Mac）
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/$APP_NAME.app" "${{ matrix.artifact }}.zip"

      - name: 压缩（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:APP_NAME" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: 在线更新测试（Windows：检查 → 下载 → 替换 → 重新打开）
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 8
        run: |
          $root = Join-Path $env:RUNNER_TEMP "upd"
          $inst = Join-Path $root "install"
          New-Item -ItemType Directory -Force $inst | Out-Null
          Copy-Item "dist\$env:APP_NAME" $inst -Recurse
          $app = Join-Path $inst $env:APP_NAME
          $exe = Join-Path $app "$env:APP_NAME.exe"
          # 给“旧版”做记号：_internal 里多一个文件、exe 时间改成 30 天前；更新后记号文件应被删除、exe 被覆盖
          Set-Content (Join-Path $app "_internal\OLD_MARKER.txt") "old"
          (Get-Item $exe).LastWriteTime = (Get-Date).AddDays(-30)
          # 本地假发布页，版本号故意更大
          $feed = Join-Path $root "feed"; New-Item -ItemType Directory -Force $feed | Out-Null
          $zip = Join-Path $feed "EngineerScheduler-windows.zip"
          Copy-Item "${{ matrix.artifact }}.zip" $zip
          $size = (Get-Item $zip).Length
          ('{"tag_name":"v99.0.0","body":"ci","assets":[{"name":"EngineerScheduler-windows.zip","size":' + $size +
           ',"browser_download_url":"http://127.0.0.1:18950/EngineerScheduler-windows.zip"}]}') | Set-Content (Join-Path $feed "latest.json") -Encoding ascii
          $srv = Start-Process python -ArgumentList "-m", "http.server", "18950", "--bind", "127.0.0.1" -WorkingDirectory $feed -PassThru -WindowStyle Hidden
          $env:ES_DATA_DIR = Join-Path $root "data"
          $old = Start-Process -FilePath $exe -ArgumentList "--web", "--port", "8768" -PassThru
          function Call($m, $body) { Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8768/api/$m" -Body $body -TimeoutSec 15 }
          for ($i = 0; $i -lt 30; $i++) { try { if ((Call "bootstrap" "[]").ok) { break } } catch { Start-Sleep -Seconds 2 } }
          Call "save_settings" '[{"update_api_url":"http://127.0.0.1:18950/latest.json","auto_check_update":false}]' | Out-Null
          $c = (Call "update_check" "[]").result
          Write-Host "检查更新：$($c.message) available=$($c.available) can_apply=$($c.can_apply)"
          if (-not $c.available -or -not $c.can_apply) { exit 1 }
          Call "update_download" "[]" | Out-Null
          for ($i = 0; $i -lt 90; $i++) { $s = (Call "update_state" "[]").result; if ($s.phase -in "ready", "error") { break }; Start-Sleep -Seconds 1 }
          Write-Host "下载：$($s.phase) $($s.message)"
          if ($s.phase -ne "ready") { exit 1 }
          Call "update_apply" "[]" | Out-Null
          $old.WaitForExit(30000) | Out-Null
          Write-Host "旧进程已退出：$($old.HasExited)"
          $log = Join-Path $env:ES_DATA_DIR "update.log"
          $relaunched = $null
          for ($i = 0; $i -lt 90; $i++) {
            $relaunched = Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe }
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "已重新打开" -Quiet) -and $relaunched) { break }
            Start-Sleep -Seconds 1
          }
          Write-Host "---- update.log ----"; Get-Content $log -Encoding utf8 -ErrorAction SilentlyContinue
          $markerGone = -not (Test-Path (Join-Path $app "_internal\OLD_MARKER.txt"))
          $exeNew = (Get-Item $exe).LastWriteTime -gt (Get-Date).AddDays(-1)
          $replaced = Select-String -Path $log -Pattern "替换完成" -Quiet
          Write-Host "替换完成：$replaced  记号文件已删：$markerGone  exe 已覆盖：$exeNew  已重新打开：$([bool]$relaunched)"
          $relaunched | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process -Filter "Name = 'msedge.exe'" | Where-Object { $_.CommandLine -like "*es-ui-*" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          if (-not ($replaced -and $markerGone -and $exeNew -and $relaunched)) { Write-Host "在线更新测试失败"; exit 1 }
          Write-Host "Windows 在线更新正常"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
